services:
  app:
    image: portfolio/react-app-image
    container_name: portfolio-react-app-container
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "9821"
    restart: unless-stopped
    
    healthcheck:
      # healthcheck command idfk
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9821"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
  
  nginx:
    image: nginx:alpine
    container_name: portoflio-nginx-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      app:
        # this should get triggered after healthcheck
        condition: service_healthy
    restart: unless-stopped

