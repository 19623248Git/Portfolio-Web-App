services:
  app:
    image: portfolio/reactAppImage
    container: portfolioReactAppContainer
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "9821:9821"
    restart: unless-stopped
    
    healthcheck:
      # healthcheck command idfk
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9821"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

