services:
  app:
    image: portfolio/react-app-image
    container_name: portfolio-react-app-container
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "9821"
    restart: unless-stopped

    # this is configured in the VM
    networks:
      - web-gateway
    
    healthcheck:
      # healthcheck command idfk
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9821"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

networks:
  web-gateway:
    external: true

